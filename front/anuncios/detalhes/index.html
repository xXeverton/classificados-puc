<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Detalhes do anúncio · Classificados PUC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rethink+Sans:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="../../css/tema.css">
  <link rel="stylesheet" href="../../css/detalhes.css">
</head>
<body>
  <header class="cabecalho" data-cabecalho></header>
  <main class="container pagina-detalhes">
    <div id="alerta" role="alert"></div>
    <div id="carregando" class="estado-carregamento" role="status">
      Carregando anúncio...
    </div>
    <article id="conteudo" class="detalhes" hidden>
      <section class="detalhes__foto" aria-label="Foto do anúncio">
        <img id="foto-anuncio" alt="" hidden>
        <div id="sem-foto" class="detalhes__foto-vazia" hidden>
          Este anúncio não possui foto.
        </div>
      </section>
      <section class="painel detalhes__painel">
        <span id="categoria" class="etiqueta"></span>
        <h1 id="titulo"></h1>
        <p id="preco" class="detalhes__preco"></p>
        <dl class="detalhes__dados">
          <div id="linha-conservacao" hidden>
            <dt>Estado de conservação</dt>
            <dd id="conservacao"></dd>
          </div>
          <div id="linha-data-evento" hidden>
            <dt>Data do evento</dt>
            <dd id="data-evento"></dd>
          </div>
          <div id="linha-horario-evento" hidden>
            <dt>Horário</dt>
            <dd id="horario-evento"></dd>
          </div>
          <div id="linha-local-evento" hidden>
            <dt>Local</dt>
            <dd id="local-evento"></dd>
          </div>
        </dl>
        <h2>Descrição</h2>
        <p id="descricao" class="detalhes__descricao"></p>
        <div class="detalhes__acoes">
          <a class="botao botao--contorno" id="editar-anuncio" href="#" hidden>Editar anúncio</a>
        </div>
        <section class="painel detalhes__anunciante" aria-labelledby="titulo-anunciante">
          <h2 id="titulo-anunciante">Anunciante</h2>
          <div class="detalhes__perfil">
            <img id="foto-anunciante" alt="" hidden>
            <div>
              <strong id="nome-anunciante"></strong>
              <span id="vinculo" class="etiqueta"></span>
            </div>
          </div>
          <div id="contatos" class="detalhes__contatos" aria-label="Contatos do anunciante"></div>
        </section>
      </section>
    </article>
  </main>
  <script type="module" src="../../js/paginas/detalhes_anuncio.js"></script>
</body>
</html>
